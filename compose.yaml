services:
  cache:
    image: redis:8.0-alpine
    container_name: cache
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    restart: always
    depends_on:
      cache:
        condition: service_healthy
  server_migrations:
    build: ./server
    container_name: server_migrations
    # Overwrite the default start command with your migration script
    command: node infrastructure/db/migrate.js
    env_file:
      - ./server/.env
    depends_on:
      cache:
        condition: service_healthy
      test_db:
        condition: service_healthy
  server:
    build: ./server
    container_name: server
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      server_migrations:
        condition: service_completed_successfully
  test_db:
    image: postgres:16-alpine
    container_name: test_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: military_gear_distribution_test
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d military_gear_distribution_test",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  db:
    image: postgres:16-alpine
    container_name: db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: military_gear_distribution
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d military_gear_distribution"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
  redis_data:

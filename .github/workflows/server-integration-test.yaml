name: Server-Integration-Test
on:
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-integration-test.yaml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
jobs:
  test-server:
    environment:
      name: server-integration-test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.DATABASE_PASSWORD }}@localhost:5432/military_gear_distribution_test
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: debug
      NODE_ENV: test
    defaults:
      run:
        working-directory: ./server
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: military_gear_distribution_test
        options: >-
          --health-cmd "pg_isready -U postgres -d military_gear_distribution_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Initialize Environment
        uses: ./.github/actions/setup-node-and-dependency
        with:
          node-version: 22
          pnpm-version: 10.26.1
          working-directory: ./server
      - name: Run Migrations
        run: pnpm db:migrate
      - name: Run Tests
        run: pnpm test

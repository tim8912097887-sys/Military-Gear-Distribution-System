name: Server-Integration-Test
on:
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-integration-test.yaml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
jobs:
  test-server:
    environment:
      name: gear-distribution-server
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: debug
      NODE_ENV: test
    defaults:
      run:
        working-directory: ./server
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: military_gear_distribution_test
        options: >-
          --health-cmd "pg_isready -U postgres -d military_gear_distribution_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.1
          standalone: true
      - name: Set up Node.js with version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: "./server/pnpm-lock.yaml"
      - name: Install Dependencies
        run: pnpm install
      - name: Run Tests
        run: pnpm test

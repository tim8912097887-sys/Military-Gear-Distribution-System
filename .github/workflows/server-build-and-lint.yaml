name: Server-Build-and-Lint
on:
  pull_request:
    branches:
      - main
      - feat/server
    paths:
      - "server/**"
      - ".github/workflows/server-build-and-lint.yaml"
  push:
    branches:
      - feat/**
    paths:
      - "server/**"
      - ".github/workflows/server-build-and-lint.yaml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
jobs:
  build-and-lint-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Initialize Environment
        uses: ./.github/actions/setup-node-and-dependency
        with:
          node-version: ${{ matrix.node-version }}
          pnpm-version: 10.26.1
      - name: Run Build
        run: pnpm run build
      - name: Run Lint
        run: pnpm run lint

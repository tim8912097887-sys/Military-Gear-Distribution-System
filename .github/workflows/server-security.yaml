name: Server-Security
on:
  pull_request:
    branches:
      - main
      - feat/server
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/server-security.yaml'
  audit-dependencies:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Initialize Environment
        uses: ./.github/actions/setup-node-and-dependency
        with:
          node-version: 22
          pnpm-version: 10.26.1
          working-directory: ./server
      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate
  server-security-status:
    needs: [changes, audit-dependencies]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Status
        run: |
          BUILD_RESULT="${{ needs.audit-dependencies.result }}"

          if [ "$BUILD_RESULT" = "success" ] || [ "$BUILD_RESULT" = "skipped" ]; then
            echo "Server security passed or were safely skipped."
            exit 0
          else
            echo "Server security failed!"
            exit 1
          fi
